# shieldnode — значения по умолчанию (ТЗ §28).
# Любое пустое значение означает «авто». Переопределяется в /etc/shieldnode/config.conf.
# ВНИМАНИЕ: не добавлять сюда net.netfilter.* — conntrack принадлежит node (ТЗ §15).

# --- общие ---
ENABLE_SHIELDNODE=1
ENABLE_SSH_PROTECTION=1
ENABLE_INVALID_DROP=1
ENABLE_LOOPBACK=1
ENABLE_ESTABLISHED=1
ENABLE_SYN_PROTECTION=1
ENABLE_ABUSE_LIMITING=1
LOG_LEVEL=info
BACKUP_KEEP=5
# анти-спуф: private-src на WAN-интерфейсе -> drop (opt-in: на NAT-нодах может резать легитимный трафик)
ENABLE_ANTISPOOF=0

# --- blocklists: агрегаторы scanner/threat (+tor opt-in, custom) с автообновлением
# Проверенный набор источников старой ветки. Наборы наполняются фоновым
# updater'ом (shieldnode-blocklist.timer), drop-правила — после whitelist,
# поэтому admin/TRUSTED_IPS агрегаторы не заблокируют.
ENABLE_BLOCKLISTS=1
ENABLE_SCANNER_LIST=1
ENABLE_THREAT_LIST=1
BLOCK_TOR=0
ENABLE_CUSTOM_LIST=1
BLOCKLIST_UPDATE_INTERVAL=360   # минут между обновлениями
BLOCKLIST_FAIL_THRESHOLD=3      # сколько подряд провалов подряд терпим
SCANNER_BLOCKLIST_SIZE=262144
THREAT_BLOCKLIST_SIZE=131072
TOR_BLOCKLIST_SIZE=16384
CUSTOM_BLOCKLIST_SIZE=65536
MIN_ENTRIES_SCANNER=1000
MIN_ENTRIES_THREAT=500
MIN_ENTRIES_TOR=100
MIN_ENTRIES_CUSTOM=0
# источники (space-separated); оператор может переопределить в config.conf
BLOCKLIST_SCANNER_URLS="https://raw.githubusercontent.com/shadow-netlab/traffic-guard-lists/refs/heads/main/public/antiscanner.list https://raw.githubusercontent.com/shadow-netlab/traffic-guard-lists/refs/heads/main/public/government_networks.list https://raw.githubusercontent.com/tread-lightly/CyberOK_Skipa_ips/main/lists/skipa_cidr.txt https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS61280 https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS213853 https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS197571 https://gist.githubusercontent.com/sngvy/07cee7ac810c9d222fbebddff8c1d1b8/raw/blacklist.txt https://raw.githubusercontent.com/ShadowWhisperer/IPs/main/Lists/Scanners https://raw.githubusercontent.com/stamparm/maltrail/master/data/mass_scanner.txt https://raw.githubusercontent.com/stamparm/maltrail/master/data/mass_scanner_cidr.txt https://raw.githubusercontent.com/OpenFilters/internet-scanners/main/cidr/binaryedge_v4.txt https://raw.githubusercontent.com/OpenFilters/internet-scanners/main/cidr/strechoid_v4.txt"
BLOCKLIST_THREAT_URLS="https://www.spamhaus.org/drop/drop_v4.json https://www.spamhaus.org/drop/drop_v6.json https://iplists.firehol.org/files/firehol_level1.netset"
# v1.1.2: ключи, читаемые кодом, но раньше не задокументированные здесь. Намеренно
# ЗАКОММЕНТИРОВАНЫ (живая пустая строка перекрыла бы значения, дописанные в кэш
# позже — first-match). Задавать в /etc/shieldnode/config.conf.
# BLOCKLIST_CUSTOM_URLS=       # URL'ы центрального custom-листа (дополняют lists/custom.txt)
# PROTECTED_TCP_EXTRA=         # доп. защищаемые TCP-порты (через пробел) к автодетекту
# PROTECTED_UDP_EXTRA=         # доп. защищаемые UDP-порты (через пробел) к автодетекту
BLOCKLIST_TOR_URLS="https://check.torproject.org/torbulkexitlist"
# Операторский custom-лист с ЦЕНТРАЛЬНОГО URL (аналог старого репо SpofyJet/shield):
# правишь один файл в репо — все ноды подтянут на ближайшем тике таймера
# (BLOCKLIST_UPDATE_INTERVAL, дефолт 360 мин). Пусто = только локальный файл.
# Локальный /etc/shieldnode/lists/custom.txt при этом ДОБАВЛЯЕТ записи
# (аналог старого custom-local.txt) — оба источника объединяются.
# Формат целевого файла: plain IP/CIDR, одна на строку (ссылки внутри не
# раскрываются — для линков есть BLOCKLIST_SCANNER_URLS).
#BLOCKLIST_CUSTOM_URLS="https://raw.githubusercontent.com/SpofyJet/shield/main/lists/custom.txt"

# --- spamhaus DROP/EDROP + CINS Army (бесплатные фиды, default 1, opt-out) ---
# Spamhaus DROP — «worst of the worst» hijacked space (~2k диапазонов v4+v6),
# без ключа. CINS Army — Collective Intelligence Network Security (~30k IP),
# без ключа. Механика атомарного swap общая с остальными списками.
ENABLE_SPAMHAUS_LIST=1
ENABLE_CINS_LIST=1
SPAMHAUS_BLOCKLIST_SIZE=8192
CINS_BLOCKLIST_SIZE=65536
MIN_ENTRIES_SPAMHAUS=50
MIN_ENTRIES_CINS=2000

# --- crowdsec community blocklist (opt-in) ---
# Два режима (CROWDSEC_MODE):
#   feed   (default при заданных кредах) — Blocklist-as-a-Service: updater качает
#          plain-text список с endpoint'а консоли (креды ниже).
#          Настройка: app.crowdsec.net → Blocklist → Integrations → "Raw IP List"
#          (ID + Basic-Auth, показываются ОДИН раз). Тариф: не чаще 1 pull/24ч
#          (иначе HTTP 429) — updater сам душит интервалом.
#   agent  (default БЕЗ кредов) — как в старом стеке: устанавливается демон
#          crowdsec, регистрируется в CAPI АНОНИМНО (аккаунт консоли НЕ нужен,
#          cscli capi register) и получает community blocklist; updater читает
#          решения ЛОКАЛЬНО (cscli decisions list). ~150-200MB RAM.
# CROWDSEC_WHITELIST_SYNC=1 — добавить admin-IP/TRUSTED_IPS в whitelist crowdsec.
ENABLE_CROWDSEC_LIST=0
CROWDSEC_MODE=auto
CROWDSEC_INTEGRATION_ID=
CROWDSEC_USER=
CROWDSEC_PASSWORD=
# интервал применения списка: для feed — не чаще 1/24ч (лимит тарифа, иначе 429)
CROWDSEC_UPDATE_INTERVAL_MIN=1440
# для agent — чтение локальной БД (демон сам тянет CAPI ~раз/2ч), 429 не грозит
CROWDSEC_AGENT_INTERVAL_MIN=30
CROWDSEC_BLOCKLIST_SIZE=262144
MIN_ENTRIES_CROWDSEC=500
CROWDSEC_WHITELIST_SYNC=1

# --- amplification-guard + ICMP-политика (default 1, opt-out) ---
# AMP: drop входящих NEW UDP с source-портов 53/123/1900/11211/389 (DNS/NTP/
# SSDP/memcached/CLDAP) — неспрошенные ответы. Свои запросы = ESTABLISHED,
# правило их не трогает. ICMP: rate-limit echo-request (10/с burst 20),
# ICMPv6 packet-too-big/time-exceeded/parameter-problem ВСЕГДА accept (PMTUD).
ENABLE_AMP_GUARD=1
ENABLE_ICMP_GUARD=1

# --- SSH (ТЗ §19–20): пусто = авто-определение порта sshd ---
SSH_PORT=
SSH_CONN_MAX=8
SSH_NEW_RATE=10
SSH_NEW_BURST=20

# Доп. whitelist (панель Remnawave, мониторинг) — через пробел, попадёт в exclude §30
TRUSTED_IPS=

# --- TCP-политика (пусто = авто) ---
TCP_NEW_RATE=300
TCP_NEW_BURST=600
TCP_SYN_RATE=50
TCP_SYN_BURST=100
TCP_CONN_MAX=15000
TCP_GLOBAL_CEIL=

# --- UDP-политика (пусто = авто) ---
# UDP per-src pps на protected_udp. 20000/с ≈ 216 Мбит/с на source-IP (QUIC 1350B)
# без учёта GRO; с GRO гигабитный клиент считается ~3-12k pps. Легитимный
# Hysteria2/TUIC не задевается, флуд (100k+ pps, GRO не склеивает) ловится.
# НЕ опускать ниже ~8000 — начнёт резать клиентов. Дальше поднимать только
# под конкретного гигабитного юзера за одним IP — и то лучше TRUSTED_IPS.
UDP_RATE=20000
# Burst покрывает массовый reconnect (все клиенты разом после мигания сети)
UDP_BURST=40000
UDP_GLOBAL_CEIL=

# --- наборы abuse (timeout сек / max size) ---
SSH_ABUSERS_TIMEOUT=3600
SSH_ABUSERS_SIZE=65536
TCP_ABUSERS_TIMEOUT=900
TCP_ABUSERS_SIZE=131072
UDP_ABUSERS_TIMEOUT=900
UDP_ABUSERS_SIZE=65536
TEMP_BLOCKLIST_TIMEOUT=3600
TEMP_BLOCKLIST_SIZE=32768

# --- persist / служба ---
PERSIST_ENABLED=1
