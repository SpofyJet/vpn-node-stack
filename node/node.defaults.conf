# node — defaults. Переопределяется в /etc/node/node.conf.
# Пустое значение везде означает auto (консервативный выбор по detect).
ENABLE_NODE=1

# §9 TCP (пусто = tier по RAM)
TCP_SOMAXCONN=
TCP_SYN_BACKLOG=
TCP_PORT_RANGE=
NET_RMEM_MAX=
NET_WMEM_MAX=
# TCP_RESERVED_PORTS=         # v1.1.7: доп. порты/диапазоны в ip_local_reserved_ports (напр. 20000-20100,30443)

# §10 UDP (rmem/wmem_max общие с TCP — управляются NET_RMEM_MAX/NET_WMEM_MAX)
UDP_MEM=

# §15 conntrack (единственный владелец — node)
CONNTRACK_MAX=
CONNTRACK_TCP_LOOSE=
# легитимные ретрансмиты вне окна conntrack не дропаются (стабильность VPN)
ENABLE_CONNTRACK_LIBERAL=1

# §8 limits
LIMIT_NOFILE=

# §11 MTU/MSS
ENABLE_MSS_CLAMP=0
MSS_CLAMP_MTU=
ENABLE_MTU_CHECK=1
# MTU_PROBE_TARGET=        # 2026-09-24 (v1.1.5): внешний хост PMTU-пробы, если gw не отвечает на ICMP (пусто = 1.1.1.1)

# §12 NIC (пусто = не трогать)
NIC_RING_RX=
NIC_RING_TX=
# дефенсивный LRO off (конфликт с ip_forward на ixgbe/vmxnet3; откат — из реестра)
NIC_LRO_OFF=1

# «Сильный» NIC-режим (opt-in): rings до max, lro off, адаптивный coalescing
# (2026-09-24, v1.1.7: tso/gso off и NIC_TXQUEUELEN убраны — вредно/не действует при fq)
ENABLE_NIC_OFFLOAD_OPT=0

# §13 RSS/RPS/XPS (RFS не реализуется). 2026-09-24 (v1.1.7): RPS по умолчанию — только при
# RX-очередей < CPU (одноочередной virtio VPS), маска NUMA-локальная; иначе пропуск (RSS)
ENABLE_RSS_BALANCE=0
ENABLE_RPS=1
ENABLE_XPS=0
# «Сильный» IRQ-режим (opt-in): spread IRQ NIC round-robin по всем CPU
ENABLE_IRQ_AFFINITY=0

# Ядро/BBR: BBR применяется когда ядро умеет (вкл по умолчанию);
# XanMod — ПО УМОЛЧАНИЮ ВКЛ (2026-09-24, v1.1.6, решение оператора): ядро ставится, активно после
# reboot (node сам не ребутает). Пропуск без ошибки: не Debian/Ubuntu x86_64, ядро уже с BBRv3
# (tcp_bbr version 3), нет suite XanMod для дистрибутива, сбой сети. ENABLE_XANMOD=0 — выключить;
# явный ENABLE_XANMOD=1 в node.conf — строго (ошибка шага вместо пропуска).
# Откат: bash -c 'source lib/kernel.sh; node_xanmod_remove' + reboot
ENABLE_BBR=1
ENABLE_XANMOD=1
# Ветка XanMod: lts (дефолт; база LTS-апстрима — только стабильные бэкпорты,
# для прод-нод) | main (rolling mainline — свежие фичи, для тестовых нод)
XANMOD_BRANCH=lts
XANMOD_VARIANT=

# окно автотюнинга TCP (tcp_rmem/tcp_wmem max) = tier rmem/wmem_max; только повышение.
# 2026-09-24 (v1.1.7): дефолт 0 -> 1. Автотюнинг TCP ограничен tcp_rmem[2]/tcp_wmem[2]
# (6/4 MiB), а не rmem_max: поток ≤ окно/RTT — 4 MiB @150мс ≈ 220 Мбит/с на клиента.
# Суммарная память TCP ограничена tcp_mem (datapath), поэтому потолок сокета безопасен.
ENABLE_TCP_BUF_TUNE=1
# TCP_SLOW_START_AFTER_IDLE=0 # v1.1.7: база (было в perf-tier); 1 = дефолт ядра
# TCP_MTU_PROBING=1           # v1.1.7: база; 1 = только при ICMP-blackhole
# VM_MIN_FREE_KBYTES=         # v1.1.7: пусто = tier, но не ниже вычисленного ядром (явное — как есть)
# EEE (802.3az) off на bare-metal NIC — минус 5-17 мкс на первый пакет пачки
ENABLE_EEE_OFF=0
# 2026-09-24 (v1.1.7): cpufreq governor -> performance (только если cpufreq есть; C-states не трогаем)
ENABLE_CPU_PERF_GOVERNOR=1

# «Сильный» TCP-стек (opt-in): tw_reuse/fin_timeout/retries2/keepalive/TFO
ENABLE_PERFORMANCE_SYSCTL=0
# --- datapath-pack 2 (порт ШАГ 7.12 старой ветки: NAPI budget, TIME_WAIT-потолок,
#     tcp_mem по RAM, rmem/wmem_default tier-aware, vm/fs-блок, PLB, fq-tune) ---
ENABLE_DATAPATH=1
ENABLE_FQ_TUNE=1            # fq: limit=100000 flow_limit=100 buckets=32768 (BBR pacing)
ENABLE_BUSY_POLL=0          # low-latency polling (-10-30µs delivery, CPU spin на простое)
NETDEV_BUDGET=600           # NAPI пакетов/poll-цикл (дефолт ядра 300 — мало при 20k+ сессий)
# NETDEV_BUDGET_USECS=       # 2026-09-24 (v1.1.7): авто — 2000µs на каждые 300 пакетов budget (600 -> 4000)
# v1.1.3: netdev_budget / netdev_max_backlog x2 ТОЛЬКО если /proc/net/softnet_stat
# доказывает насыщение (squeeze > 0.1% processed / dropped > 0); ключи, явно
# заданные в node.conf, не трогаются. 0 = прежнее поведение (фиксированные значения).
AUTO_SOFTNET_TUNE=1
TCP_MAX_TW_BUCKETS=524288   # TIME_WAIT-потолок (дефолт 16-32k)
TCP_MEM_PCT=25              # потолок tcp_mem, % от RAM
# VM_OVERCOMMIT=              # 2026-09-24 (v1.1.7): только если задан явно (раньше 1 на <=4GB)
# vm.dirty_*_bytes 64M/256M (ratio не используем: % от RAM на больших нодах =
# гигабайты dirty-буферов), swappiness/min_free_kbytes — tier-значения,
# fs.file-max (только повышение), inotify 524288/8192/65536.
# v1.1.7: watermark_boost_factor/page-cluster/vfs_cache_pressure/overcommit/max_map_count,
# rmem/wmem_default, tcp_plb_enabled, udp_rmem/wmem_min, conntrack udp-таймауты — убраны.

# v1.1.2: ключи, читаемые кодом, но раньше не задокументированные здесь. Намеренно
# ЗАКОММЕНТИРОВАНЫ: живая пустая строка в defaults встала бы в CONFIG_CACHE и (при
# first-match) перекрыла бы значения, дописанные в кэш позже. Раскомментировать и
# задать значение — в /etc/node/node.conf.
# FQ_LIMIT=100000
# FQ_FLOW_LIMIT=100            # v1.1.7: дефолт ядра (было 1000)
# FQ_BUCKETS=32768
# NET_RMEM_DEFAULT=            # v1.1.7: дефолт ядра (212992); задать — только явно
# NET_WMEM_DEFAULT=            # v1.1.7: дефолт ядра (212992); задать — только явно
# VM_MAX_MAP_COUNT=1048576

# Интеграции
INTEGRATION_DOCKER=0
IP_FORWARD=

# §17 hardening — проверенные безопасные отключения (1 = отключить, 0 = не трогать).
# Reversibility-first: состояние юнитов снапшотится, rollback всё возвращает.
# HARDEN_MTA/SNAPD остаются opt-in: у оператора может быть почта с ноды /
# snapd связан с cloud-init на Ubuntu Pro.
# 2026-09-24 (v1.1.7, решение оператора): IPv6 ВЫКЛЮЧЕН по умолчанию (sysctl disable_ipv6,
# boot не трогаем). Цена — нет v6-egress прокси и v6-входа VLESS/Hysteria2; включить — HARDEN_IPV6=0.
HARDEN_IPV6=1
HARDEN_BG_SERVICES=1
HARDEN_UNATTENDED=1
HARDEN_PACKAGEKIT=1
HARDEN_IRQBALANCE=1          # v1.1.7: действует только вместе с ENABLE_IRQ_AFFINITY=1
HARDEN_RPCBIND=1
HARDEN_KDUMP=1
HARDEN_MTA=0
HARDEN_SNAPD=0

# §17 storage (проверенные твики старой ветки; контейнеры/overlay — пропуск)
HARDEN_THP=1            # transparent hugepages -> madvise
HARDEN_SCHED_NONE=1     # I/O scheduler=none для SSD/virtio (гипервизор шедулит)
HARDEN_NOATIME=1        # noatime вместо relatime + снятие discard + weekly fstrim
# classic NAPI (gro_flush/napi_defer -> 0/0) — opt-in, для малых нод (50-200 юзеров)
ENABLE_LOW_LATENCY_NIC=0

# Поведение
BACKUP_KEEP=5
LOG_LEVEL=info
